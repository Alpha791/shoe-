  const shoes = [

    { name: "Valentino", price: 2500, categories: ["women","unisex"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/valentino.jpeg" },
    { name: "Ballerina flats", price: 1500, categories: ["women"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/barelllina.jpeg" },
    { name: "Mules", price: 1200, categories: ["women"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/mules.jpeg" },
    { name: "Solomon", price: 3500, categories: ["boots","men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/robin-benzrihem-8iZvOp39rzw-unsplash.jpg" },

    { name: "Columbia", price: 5000, categories: ["boots","unisex"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/clay-banks-nj0a29qb_jo-unsplash.jpg" },
    { name: "Dukathron", price: 4500, categories: ["boots","men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/ana-azuria-gRTFpyLbIO4-unsplash.jpg" },
    { name: "Timberland", price: 3500, categories: ["boots","men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/chris-knight-VytE4-Bt4Ds-unsplash.jpg" },
    { name: "Timberland (2)", price: 2000, categories: ["boots","men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/siora-photography-B1Sn_ADEohs-unsplash.jpg" },
    {name: "CAT", price: 3200, categories: ["men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/WhatsApp Image 2026-03-12 at 10.17.30 (1).jpeg" },
    {name: "Timberland sport", price: 3200, categories: ["men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/WhatsApp Image 2026-03-12 at 10.17.11.jpeg" },
    {name: "Caterpillar (2)", price: 3200, categories: ["men"], image: "https://raw.githubusercontent.com/Alpha791/shoe-/main/images/WhatsApp Image 2026-03-12 at 10.17.30.jpeg" }
  ];

  const CATS = ["all","sneakers","boots","heels","men","women","unisex"];

  const categoryBar = document.getElementById("category-bar");
  const gallery = document.getElementById("adidas-gallery");
  const modal = document.getElementById("productModal");
  const modalClose = document.getElementById("modalClose");
  const modalImg = document.getElementById("modal-image");
  const modalName = document.getElementById("modal-product-name");
  const modalPrice = document.getElementById("modal-product-price");
  const modalCats = document.getElementById("modal-product-cats");
  const modalWp = document.getElementById("modal-whatsapp-link");
  const modalLabs = document.getElementById("modal-labs-link");

  function renderCategories(){
    const frag = document.createDocumentFragment();
    CATS.forEach(cat=>{
      const b=document.createElement("button");
      b.className="cat-btn";
      b.textContent=cat.toUpperCase();
      b.dataset.cat=cat;
      if(cat==="all")b.classList.add("active");
      b.onclick=()=>filterCategory(cat,b);
      frag.appendChild(b);
    })
    categoryBar.appendChild(frag);
  }

  function filterCategory(cat,btn){
    document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    gallery.style.opacity=0;

    setTimeout(()=>{
      if(cat==="all")renderGallery(shoes);
      else renderGallery(shoes.filter(s=>s.categories.includes(cat)));
      gallery.style.opacity=1;
    },180);
  }

  const obsOptions={root:null,rootMargin:"150px",threshold:0.05};
  const imgObs=new IntersectionObserver((entries,obs)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const img=e.target;
        if (img.dataset.src) {
          img.src=img.dataset.src;
          img.onload=()=>img.classList.add("loaded");
        }
        obs.unobserve(img);
      }
    })
  },obsOptions);

  // Render gallery using a document fragment and then observe images.
  function renderGallery(list){
    gallery.innerHTML="";
    const frag=document.createDocumentFragment();
    list.forEach((shoe,i)=>{
      const card=document.createElement("article");
      card.className="product-card";

      const wrap=document.createElement("div");
      wrap.className="img-wrap";

      const img=document.createElement("img");
      img.dataset.src=shoe.image;
      // lightweight placeholder (small data URI) to reduce initial download compared to an external placeholder
      img.src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'%3E%3Crect width='100%25' height='100%25' fill='%23000'/%3E%3C/svg%3E";
      img.loading="lazy";
      img.alt=shoe.name;
      img.onclick=()=>openModal(i);
      wrap.appendChild(img);

      const meta=document.createElement("div");
      meta.className="meta";
      meta.innerHTML=`<h4>${shoe.name}</h4><p>KES ${shoe.price}</p>`;

      const btn=document.createElement("button");
      btn.className="contact-btn";
      btn.innerHTML=`<i class=\"fab fa-whatsapp\"></i> Contact`;
      btn.onclick=()=>openModal(i);

      card.appendChild(wrap);
      card.appendChild(meta);
      card.appendChild(btn);

      frag.appendChild(card);
    });

    gallery.appendChild(frag);

    // Observe images after they are in the DOM to reduce layout thrash
    gallery.querySelectorAll('img').forEach(img=>imgObs.observe(img));
  }

  function openModal(i){
    const s=shoes[i];
    modalImg.src=s.image;
    modalName.textContent=s.name;
    modalPrice.textContent="KES "+s.price;
    modalCats.textContent="Categories: "+s.categories.join(", ");
    modalWp.href="https://wa.me/254717616895?text="+encodeURIComponent(`Hello! I want more info about ${s.name} and similar products priced at KES ${s.price}.`);
    // Ensure the labs button opens the requested URL (keeps it static)
    modalLabs.href = "https://labs.google.com/pomelli/website/8d42Q0UYjoP2kYpK-KQ_8F";
    modal.classList.add("active");
  }

  modalClose.onclick=()=>modal.classList.remove("active");
  modal.onclick=e=>{ if(e.target===modal) modal.classList.remove("active") };

  renderCategories();
  renderGallery(shoes);

  // Minimal protection for images across future DOM changes
  const observer = new MutationObserver((mutations) => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node && node.querySelectorAll) {
          node.querySelectorAll('img').forEach(img => img.addEventListener('dragstart', (e) => e.preventDefault()));
        }
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });
 
})();
</script>
